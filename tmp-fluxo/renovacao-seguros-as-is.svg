<text x="755.8000000000001" y="962" font-size="12" fill="#334155">Início e fim</text>
<text x="24" y="1008" font-size="14" font-weight="700" fill="#0F172A">A confirmar</text>
<text x="24" y="1032" font-size="13" fill="#334155" xml:space="preserve">• Quem trata a crítica e o que acontece com o processo depois dela?</text>
<text x="24" y="1050" font-size="13" fill="#334155" xml:space="preserve">• O robô verifica endosso e sinistro antes ou depois de baixar o PDF? (aqui assumi: depois de baixar)</text>
<text x="24" y="1068" font-size="13" fill="#334155" xml:space="preserve">• &quot;Depois de baixar tudo&quot;: os anexos sobem em lote, depois de a fila inteira terminar, ou item a item?</text>
<text x="24" y="1086" font-size="13" fill="#334155" xml:space="preserve">• O operador só aciona o robô ou também confere o lote antes?</text>
<text x="24" y="1104" font-size="13" fill="#334155" xml:space="preserve">• A medir: tempo por apólice, taxa de crítica por seguradora e horas por lote de 1.000.</text>
