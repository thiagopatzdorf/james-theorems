<!doctype html>
<meta charset="utf-8">
<title>Abrindo o fluxo no draw.io…</title>
<p style="font:16px system-ui;margin:2em">Abrindo o fluxo no draw.io…</p>
<script>
// Lê o .drawio (mesma origem, servido pelo abrir.*) e entrega ao editor no hash #R,
// que aceita o XML cru e não tem o limite de tamanho de uma linha de comando.
var f = new URLSearchParams(location.search).get("f");
var base = "drawio/index.html?offline=1&lang=pt&splash=0";
if (!f || f.indexOf("..") >= 0) location.replace(base);
else fetch(f).then(function (r) { if (!r.ok) throw 0; return r.text(); })
  .then(function (x) { location.replace(base + "#R" + encodeURIComponent(x)); })
  .catch(function () { location.replace(base); });
</script>
