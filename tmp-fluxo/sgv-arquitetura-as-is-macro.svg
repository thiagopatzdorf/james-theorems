<text x="1035.2" y="1102" font-size="12" fill="#334155">Início e fim</text>
<text x="24" y="1148" font-size="14" font-weight="700" fill="#0F172A">Medido e informado pelo time</text>
<text x="24" y="1172" font-size="13" fill="#334155" xml:space="preserve">• Tempo por apólice em tela: 3 minutos. Taxa de crítica: 20% das apólices e endossos. O lote é instantâneo (minutos). Não há métrica por seguradora.</text>
<text x="24" y="1216" font-size="14" font-weight="700" fill="#0F172A">A confirmar</text>
<text x="24" y="1240" font-size="13" fill="#334155" xml:space="preserve">• Qual é o sistema de cotação (a tela com 90+ seletores) e o que ele devolve ao Fluid?</text>
<text x="24" y="1258" font-size="13" fill="#334155" xml:space="preserve">• Como o Fluid e o UiPath se falam: só API para anexos e protocolo, ou também tela? Onde roda o UiPath (Orchestrator, quantos robôs)?</text>
<text x="24" y="1276" font-size="13" fill="#334155" xml:space="preserve">• O agente de IA: qual modelo e onde roda? O Teams é um bot ou uma pessoa que chama?</text>
<text x="24" y="1294" font-size="13" fill="#334155" xml:space="preserve">• O Denodo entrega ao Dremio por conexão direta ou por uma carga? O que é CAS e como ele alimenta a Pioneira?</text>
<text x="24" y="1312" font-size="13" fill="#334155" xml:space="preserve">• Onde ficam as credenciais dos 5 portais e do sistema de cotação (cofre)?</text>
</svg>