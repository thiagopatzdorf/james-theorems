<text x="969.2" y="1029" font-size="12" fill="#334155">Início e fim</text>
<text x="24" y="1075" font-size="14" font-weight="700" fill="#0F172A">Medido e informado pelo time</text>
<text x="24" y="1099" font-size="13" fill="#334155" xml:space="preserve">• Se a negociação for por ligação, não há contrato para assinar; por WhatsApp sempre há.</text>
<text x="24" y="1117" font-size="13" fill="#334155" xml:space="preserve">• O detalhe da renovação está em sgv-renovacao-seguros-as-is-v7.</text>
<text x="24" y="1135" font-size="13" fill="#334155" xml:space="preserve">• Se a emissão passar de 5 dias ou a vistoria for recusada, o processo volta para a negociação.</text>
<text x="24" y="1179" font-size="14" font-weight="700" fill="#0F172A">A confirmar</text>
<text x="24" y="1203" font-size="13" fill="#334155" xml:space="preserve">• Quem faz a vistoria (a seguradora, uma empresa parceira ou o próprio cliente)? É ela que recusa?</text>
<text x="24" y="1221" font-size="13" fill="#334155" xml:space="preserve">• A cotação do seguro novo é feita em quais portais? Quantas seguradoras por pedido? Quanto tempo leva?</text>
<text x="24" y="1239" font-size="13" fill="#334155" xml:space="preserve">• Lead do Salesforce e pedido da agência entram no mesmo processo do Fluid, ou são processos diferentes?</text>
<text x="24" y="1257" font-size="13" fill="#334155" xml:space="preserve">• O seguro novo dispara o RPA | Aviso de Renovação só na renovação, ou também algum aviso ao fechar?</text>
<text x="24" y="1275" font-size="13" fill="#334155" xml:space="preserve">• O &quot;esperar 1 ano&quot; é só o dash do Power BI ou existe um agendamento? Quem garante que nenhuma apólice some do dash?</text>
<text x="24" y="1293" font-size="13" fill="#334155" xml:space="preserve">• Quando a emissão devolve o processo para a negociação, volta para o mesmo operador?</text>
