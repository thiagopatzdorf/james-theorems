<text x="24" y="38" font-size="22" font-weight="700" fill="#0F172A">SGV · Novo seguro + ciclo de renovação — AS IS macro</text>
<text x="24" y="62" font-size="13" fill="#475569">Visão macro do que acontece hoje, do pedido da agência (ou lead do Salesforce) até a apólice emitida, e como o Denodo guarda o ano da renovação para o fluxo de renovação começar cerca de 40 dias antes de vencer. A cotação do seguro novo é manual; a negociação, a assinatura e a emissão seguem o mesmo caminho da renovação. Pontos em &quot;A confirmar&quot; ainda não foram validados.</text>
