<!doctype html>
<!--
  Cena WebGL do banner e do social preview: a fita de von Neumann, o log que se dobra em estado.
  Símbolos soltos (o caos) pousam nas células de uma fita luminosa; a fita se enrola numa espiral que
  converge para um único ponto de ouro, o estado S_n = foldl δ S_0 log.
  Não é página publicada: docs/assets/gerar_identidade.py a serve num diretório temporário (com three.js e a
  fonte baixados, fixados por versão) e tira o retrato com o Chromium headless.
  Parâmetros: ?tema=escuro|claro&peca=banner|social
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "CG"; src: url("fontes/cg-500-normal.woff") format("woff"); font-weight: 500; }
  @font-face { font-family: "CG"; src: url("fontes/cg-400-italic.woff") format("woff"); font-style: italic; }
  :root { --fundo: #141414; --tinta: #F6F1E7; --suave: #A9A193; --ouro: #B8975A; --ourotx: #C9AB72; }
  :root[data-tema="claro"] { --fundo: #F6F1E7; --tinta: #141414; --suave: #5C564C; --ourotx: #7A5F2F; }
  html, body { margin: 0; background: var(--fundo); overflow: hidden; }
  #palco { position: relative; }
  canvas { display: block; }
  #texto { position: absolute; inset: 0; pointer-events: none; font-family: "CG", serif; color: var(--tinta); }
  .sobre { position: absolute; letter-spacing: .32em; font-weight: 500; color: var(--ourotx); white-space: nowrap; }
  .titulo { position: absolute; font-weight: 500; letter-spacing: -.005em; line-height: 1; white-space: nowrap; }
  .fio { position: absolute; height: 1px; background: var(--ouro); }
  .sub { position: absolute; font-style: italic; color: var(--suave); line-height: 1.3; white-space: nowrap; }
  #veu { position: absolute; inset: 0; pointer-events: none; }
</style>
<script type="importmap">{"imports": {"three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/"}}</script>
</head>
<body>
<div id="palco"><div id="veu"></div><div id="texto"></div></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const q = new URLSearchParams(location.search);
const tema = q.get("tema") || "escuro";
const peca = q.get("peca") || "banner";
const escuro = tema === "escuro";
const banner = peca === "banner";
document.documentElement.dataset.tema = tema;
const W = 1280, H = banner ? 400 : 640;

// gerador determinístico: a mesma imagem a cada execução (mulberry32)
let semente = banner ? 1903 : 1966;
const rnd = () => { semente |= 0; semente = semente + 0x6D2B79F5 | 0; let t = Math.imul(semente ^ semente >>> 15, 1 | semente);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const suave = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const FUNDO = new THREE.Color(escuro ? 0x141414 : 0xF6F1E7);
const TINTA = new THREE.Color(escuro ? 0xF6F1E7 : 0x141414);
const OURO = new THREE.Color(0xB8975A);
const OURO_LUZ = new THREE.Color(escuro ? 0xE9CF94 : 0x8C6E36);

await document.fonts.load('500 96px "CG"');
await document.fonts.load('italic 400 96px "CG"');

// --- atlas de símbolos: 4 x 4 células, branco sobre transparente; a cor vem do vértice ------------------
// Só caracteres latinos: a fonte baixada é o subconjunto latin, e um glifo de outra fonte quebraria o tom.
const SIMBOLOS = ["0", "1", "0", "1", "e", "S", "F", "X", "L", "K", "n", "+", "=", "a", "x", "y"];
const ITALICO = new Set(["e", "S", "F", "X", "L", "K", "n", "a", "x", "y"]);
const atlas = document.createElement("canvas"); atlas.width = atlas.height = 512;
{
  const g = atlas.getContext("2d");
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  SIMBOLOS.forEach((s, i) => {
    g.font = ITALICO.has(s) ? 'italic 400 104px "CG"' : '500 100px "CG"';
    g.fillText(s, (i % 4) * 128 + 64, Math.floor(i / 4) * 128 + 70);
  });
}
const texAtlas = new THREE.CanvasTexture(atlas);
texAtlas.generateMipmaps = true; texAtlas.minFilter = THREE.LinearMipmapLinearFilter;
// sorteia um símbolo: 0 e 1 dominam a fita (é um log), letras aparecem de vez em quando
const sorteia = () => rnd() < 0.62 ? (rnd() < 0.5 ? 0 : 1) : 4 + Math.floor(rnd() * 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(FUNDO, 1);
document.getElementById("palco").prepend(renderer.domElement);
const cena = new THREE.Scene();
// fundo pela cena, não pelo clearColor: com o EffectComposer o clearColor sai sem conversão de cor
cena.background = FUNDO;
const DENS = escuro ? 0.024 : 0.022;
cena.fog = new THREE.FogExp2(FUNDO, DENS);
const FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 200);
camera.position.set(banner ? 1.2 : 0.4, 0.6, banner ? 25 : 27);
camera.lookAt(banner ? 2.2 : 1.4, 0, 0);
// pixels (do dispositivo) por unidade de mundo a profundidade 1: tamanho de ponto em unidades de mundo
const PX = H * window.devicePixelRatio / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)));

// --- a fita: uma onda que entra do caos e se enrola numa espiral até um ponto -----------------------
// A onda chega à base da espiral na horizontal e a espiral gira no sentido anti-horário: a tangente é
// contínua na junção, sem o "gancho" que aparecia quando a onda chegava de lado.
const xEsp = banner ? 12.7 : 10.2, yEsp = banner ? 0.75 : 0.2;
const r0 = banner ? 3.0 : 3.5, voltas = 2.75;
const inclina = new THREE.Euler(-0.38, 0.30, 0);           // plano da espiral, levemente inclinado
const nEsp = new THREE.Vector3(0, 0, 1).applyEuler(inclina);
const pEsp = (th, r) => new THREE.Vector3(Math.cos(th) * r, Math.sin(th) * r, 0).applyEuler(inclina).add(new THREE.Vector3(xEsp, yEsp, 0));
const ctrl = [];
const xIni = banner ? 0.2 : -1.2, yIni = banner ? -0.9 : -1.2, zIni = 2.4;
const entrada = pEsp(-Math.PI / 2, r0);
for (let k = 0; k <= 24; k++) {                            // a onda
  const t = k / 24, sm = t * t * (3 - 2 * t);
  const x = xIni + t * (entrada.x - xIni);
  const y = yIni + (entrada.y - yIni) * sm + 0.75 * Math.sin(2 * Math.PI * t) * (1 - t);
  ctrl.push(new THREE.Vector3(x, y, zIni + (entrada.z - zIni) * sm));
}
const nOnda = ctrl.length;
const passos = 320;
for (let k = 1; k <= passos; k++) {                        // a espiral logarítmica, encolhendo para o centro
  const t = k / passos;
  ctrl.push(pEsp(-Math.PI / 2 + t * voltas * 2 * Math.PI, r0 * Math.pow(0.02, t)));
}
// a junção onda→espiral é suavizada pela própria Catmull-Rom
const curva = new THREE.CatmullRomCurve3(ctrl, false, "centripetal");
const AMOSTRAS = 4000;
const pts = curva.getSpacedPoints(AMOSTRAS);
const comp = curva.getLength();
// fração de comprimento onde a espiral começa (medida, não suposta)
let fracEsp = 0; { const L0 = new THREE.CatmullRomCurve3(ctrl.slice(0, nOnda + 1), false, "centripetal").getLength(); fracEsp = L0 / comp; }
const quadro = (u) => {                                     // ponto, tangente e direção da largura em u∈[0,1]
  const i = Math.min(AMOSTRAS - 1, Math.floor(u * AMOSTRAS));
  const p = pts[i], t = pts[i + 1].clone().sub(pts[i]).normalize();
  const nrm = new THREE.Vector3(0, 0, 1).lerp(nEsp, suave(fracEsp - 0.06, fracEsp + 0.04, u)).normalize();
  const lado = new THREE.Vector3().crossVectors(t, nrm).normalize();
  return { p, t, lado };
};
// largura: plena na onda, afina ao longo da espiral (o log comprimido em estado)
const LARG = 0.74;
const largura = (u) => LARG * (u < fracEsp ? 1 : Math.pow(1 - (u - fracEsp) / (1 - fracEsp), 0.85) * 0.92 + 0.06);
const brilhoOuro = (u) => suave(fracEsp - 0.25, 1.0, u);
// a fita nasce do caos: no começo ela se dissolve no fundo em vez de começar num corte
const NADA = escuro ? new THREE.Color(0x000000) : FUNDO;   // aditivo: preto não soma nada
const nasce = (u) => suave(0.0, 0.09, u);
const esmaece = (c, u) => c.lerp(NADA, 1 - nasce(u));

// bordas, preenchimento e divisórias
{
  const N = 2400, a = [], b = [], fill = [], fillCor = [];
  for (let k = 0; k <= N; k++) {
    const u = k / N * 0.995, { p, lado } = quadro(u), w = largura(u) / 2;
    a.push(p.clone().addScaledVector(lado, w)); b.push(p.clone().addScaledVector(lado, -w));
  }
  const borda = (arr) => {
    const g = new THREE.BufferGeometry().setFromPoints(arr);
    const cores = new Float32Array(arr.length * 3);
    arr.forEach((_, k) => { const c = esmaece(TINTA.clone().lerp(OURO_LUZ, 0.35 + 0.65 * brilhoOuro(k / N)), k / N); cores.set([c.r, c.g, c.b], k * 3); });
    g.setAttribute("color", new THREE.BufferAttribute(cores, 3));
    cena.add(new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: escuro ? 1.0 : 0.85 })));
  };
  borda(a); borda(b);
  const pos = [], idx = [], cf = [];
  for (let k = 0; k <= N; k++) { pos.push(a[k].x, a[k].y, a[k].z, b[k].x, b[k].y, b[k].z);
    const c = esmaece(OURO.clone(), k / N); cf.push(c.r, c.g, c.b, c.r, c.g, c.b); }
  for (let k = 0; k < N; k++) { const i = 2 * k; idx.push(i, i + 1, i + 2, i + 1, i + 3, i + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g.setAttribute("color", new THREE.Float32BufferAttribute(cf, 3));
  cena.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: escuro ? 0.08 : 0.16,
    side: THREE.DoubleSide, depthWrite: false, blending: escuro ? THREE.AdditiveBlending : THREE.NormalBlending })));
}

// células: divisórias a passo constante de comprimento de arco; um símbolo por célula
const PASSO = 0.62;
const celulas = [];
{
  const seg = [], cores = [];
  for (let s = PASSO; s < comp * 0.985; s += PASSO * (1 - 0.6 * suave(fracEsp, 1, s / comp))) {
    const u = s / comp, { p, lado } = quadro(u), w = largura(u) / 2;
    seg.push(p.clone().addScaledVector(lado, w), p.clone().addScaledVector(lado, -w));
    const c = esmaece(TINTA.clone().lerp(OURO_LUZ, 0.3 + 0.7 * brilhoOuro(u)), u);
    cores.push(c.r, c.g, c.b, c.r, c.g, c.b);
    celulas.push({ u, s });
  }
  const g = new THREE.BufferGeometry().setFromPoints(seg);
  g.setAttribute("color", new THREE.Float32BufferAttribute(cores, 3));
  cena.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: escuro ? 0.5 : 0.45 })));
}
// centro de cada célula (meio caminho até a próxima divisória)
const centros = celulas.slice(0, -1).map((c, k) => {
  const u = (c.u + celulas[k + 1].u) / 2; return { u, ...quadro(u), simb: sorteia() };
});

// --- símbolos: os da fita (pousados) e os do caos (a caminho) --------------------------------------
const simbolos = [];   // {x,y,z, cor, tam, alfa, idx, rot}
for (const c of centros) {
  const ou = brilhoOuro(c.u);
  const cor = TINTA.clone().lerp(OURO_LUZ, ou * 0.95);
  const tam = largura(c.u) * 0.86;
  simbolos.push({ p: c.p.clone().addScaledVector(new THREE.Vector3(0, 0, 1).lerp(nEsp, 0.5), 0.004), cor, tam,
    alfa: (escuro ? 0.92 : 0.9) * (1 - 0.35 * suave(0.9, 1, c.u)) * nasce(c.u), idx: c.simb, rot: 0 });
}
// os do caos: nascem numa nuvem à esquerda e são puxados para uma célula da onda, girando menos à medida que chegam
const alvosOnda = centros.filter(c => c.u < fracEsp * 0.9);
const NCAOS = banner ? 1300 : 1500;
const xC0 = banner ? -3.6 : -4.4, xC1 = banner ? 4.0 : 2.6;
for (let i = 0; i < NCAOS; i++) {
  const p = Math.pow(rnd(), 1.35);
  const alvo = alvosOnda[Math.floor(rnd() * Math.min(alvosOnda.length, 6 + p * alvosOnda.length))];
  const xc = xC0 + p * (xC1 - xC0) + gauss() * 1.0 * (1 - p);
  const esp = 2.1 + 1.3 * (1 - p);
  const yc = gauss() * esp * 0.62, zc = gauss() * esp * 0.9;
  const w = suave(0.45, 1.0, p);
  if (w > 0.97) continue;                         // já pousado: a célula da fita o representa
  const pos = new THREE.Vector3(xc, yc, zc).lerp(alvo.p, w);
  const cor = TINTA.clone().lerp(OURO_LUZ, Math.pow(w, 2) * 0.5);
  simbolos.push({ p: pos, cor, tam: (0.34 + rnd() * 0.5) * (1 - 0.3 * w) + 0.16 * w,
    alfa: (0.30 + 0.6 * rnd()) * (escuro ? 0.55 : 0.75) * suave(-0.1, 0.12, p) * (0.6 + 0.4 * w),
    idx: w > 0.5 ? alvo.simb : sorteia(), rot: (1 - w) * gauss() * 1.4 });
}
{
  const n = simbolos.length, pos = new Float32Array(n * 3), cor = new Float32Array(n * 3);
  const tam = new Float32Array(n), alfa = new Float32Array(n), idx = new Float32Array(n), rot = new Float32Array(n);
  simbolos.forEach((s, i) => { pos.set([s.p.x, s.p.y, s.p.z], i * 3); cor.set([s.cor.r, s.cor.g, s.cor.b], i * 3);
    tam[i] = s.tam; alfa[i] = s.alfa; idx[i] = s.idx; rot[i] = s.rot; });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  for (const [k, v, d] of [["cor", cor, 3], ["tam", tam, 1], ["alfa", alfa, 1], ["idx", idx, 1], ["rot", rot, 1]])
    g.setAttribute(k, new THREE.BufferAttribute(v, d));
  const m = new THREE.ShaderMaterial({
    uniforms: { atlas: { value: texAtlas }, px: { value: PX }, fundo: { value: escuro ? new THREE.Color(0) : FUNDO }, dens: { value: DENS } },
    vertexShader: `
      attribute vec3 cor; attribute float tam; attribute float alfa; attribute float idx; attribute float rot;
      varying vec3 vCor; varying float vAlfa; varying float vProf; varying float vIdx; varying float vRot;
      uniform float px;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vProf = -mv.z; vCor = cor; vAlfa = alfa; vIdx = idx; vRot = rot;
        gl_PointSize = tam * px / vProf;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vCor; varying float vAlfa; varying float vProf; varying float vIdx; varying float vRot;
      uniform sampler2D atlas; uniform vec3 fundo; uniform float dens;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float cs = cos(vRot), sn = sin(vRot);
        c = vec2(cs * c.x - sn * c.y, sn * c.x + cs * c.y) + 0.5;
        if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0) discard;
        vec2 cel = vec2(mod(vIdx, 4.0), floor(vIdx / 4.0));
        vec2 uv = vec2((cel.x + c.x) / 4.0, 1.0 - (cel.y + c.y) / 4.0);
        float a = texture2D(atlas, uv).a;
        if (a < 0.02) discard;
        float nevoa = 1.0 - exp(-pow(dens * vProf, 2.0));
        gl_FragColor = vec4(mix(vCor, fundo, nevoa), a * vAlfa * (1.0 - 0.85 * nevoa));
      }`,
    transparent: true, depthWrite: false, blending: escuro ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  cena.add(new THREE.Points(g, m));
}

// --- poeira: o pó do caos, parte dele já atraído para a fita ----------------------------------------
{
  const N = banner ? 15000 : 18000;
  const pos = new Float32Array(N * 3), cor = new Float32Array(N * 3), tam = new Float32Array(N), alfa = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const p = Math.pow(rnd(), 1.5);
    const xc = xC0 - 0.5 + p * (xC1 - xC0 + 1.5) + gauss() * 1.2 * (1 - p);
    const esp = 2.3 + 1.3 * (1 - p);
    let v = new THREE.Vector3(xc, gauss() * esp * 0.7, gauss() * esp);
    const w = suave(0.5, 1.0, p);
    const u = Math.min(0.97, rnd() * (fracEsp + 0.25));
    const { p: pf, lado } = quadro(u);
    const alvo = pf.clone().addScaledVector(lado, (rnd() - 0.5) * largura(u) * 1.6);
    v.lerp(alvo, w * 0.96);
    pos.set([v.x, v.y, v.z], i * 3);
    const c = TINTA.clone().lerp(OURO_LUZ, Math.pow(w, 2) * 0.8);
    cor.set([c.r, c.g, c.b], i * 3);
    tam[i] = (0.6 + rnd() * 1.5) * (1 - 0.4 * w);
    alfa[i] = (0.2 + 0.8 * rnd()) * (escuro ? 0.36 : 0.7) * suave(-0.12, 0.1, p);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("cor", new THREE.BufferAttribute(cor, 3));
  g.setAttribute("tam", new THREE.BufferAttribute(tam, 1));
  g.setAttribute("alfa", new THREE.BufferAttribute(alfa, 1));
  cena.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { escala: { value: H * window.devicePixelRatio * (escuro ? 0.0036 : 0.0042) }, fundo: { value: escuro ? new THREE.Color(0) : FUNDO }, dens: { value: DENS } },
    vertexShader: `attribute vec3 cor; attribute float tam; attribute float alfa;
      varying vec3 vCor; varying float vAlfa; varying float vProf; uniform float escala;
      void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vProf = -mv.z; vCor = cor; vAlfa = alfa;
        gl_PointSize = tam * escala * (22.0 / vProf); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying vec3 vCor; varying float vAlfa; varying float vProf; uniform vec3 fundo; uniform float dens;
      void main() { vec2 c = gl_PointCoord - 0.5; float r = length(c); if (r > 0.5) discard;
        float nevoa = 1.0 - exp(-pow(dens * vProf, 2.0));
        gl_FragColor = vec4(mix(vCor, fundo, nevoa), vAlfa * smoothstep(0.5, 0.0, r) * (1.0 - 0.85 * nevoa)); }`,
    transparent: true, depthWrite: false, blending: escuro ? THREE.AdditiveBlending : THREE.NormalBlending,
  })));
}

// --- o estado: o ponto de ouro onde a espiral termina -------------------------------------------------
{
  const fim = pts[AMOSTRAS];
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 24), new THREE.MeshBasicMaterial({ color: escuro ? 0xF2DCA6 : 0x8C6E36 }));
  m.position.copy(fim); cena.add(m);
  // halo: disco com queda radial, sempre de frente para a câmera
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), new THREE.ShaderMaterial({
    uniforms: { cor: { value: OURO_LUZ }, forca: { value: escuro ? 0.55 : 0.35 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec2 vUv; uniform vec3 cor; uniform float forca;
      void main() { float r = length(vUv - 0.5) * 2.0; gl_FragColor = vec4(cor, forca * pow(max(0.0, 1.0 - r), 3.0)); }`,
    transparent: true, depthWrite: false, blending: escuro ? THREE.AdditiveBlending : THREE.NormalBlending,
  }));
  halo.position.copy(fim); halo.lookAt(camera.position); cena.add(halo);
}

// --- render ---------------------------------------------------------------------------------------
if (escuro) {
  const comp = new EffectComposer(renderer);
  comp.addPass(new RenderPass(cena, camera));
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.5, 0.45));
  comp.addPass(new OutputPass());
  comp.render();
} else {
  renderer.render(cena, camera);
}

// --- texto (composto sobre a cena, à esquerda, no vazio) -------------------------------------------
const T = document.getElementById("texto");
const L = banner
  ? { x: 88, sobre: [150, 13], titulo: [168, 84], fio: 264, sub: [282, 22], subTxt: "o log que se dobra em estado, do caos à estrutura" }
  : { x: 96, sobre: [234, 16], titulo: [254, 100], fio: 390, sub: [410, 30], subTxt: "o log que se dobra em estado,<br>do caos à estrutura" };
T.innerHTML = `
  <div class="sobre" style="left:${L.x}px;top:${L.sobre[0] - L.sobre[1]}px;font-size:${L.sobre[1]}px">TEOREMAS EM LEAN 4</div>
  <div class="titulo" style="left:${L.x - 4}px;top:${L.titulo[0]}px;font-size:${L.titulo[1]}px">James</div>
  <div class="fio" style="left:${L.x}px;top:${L.fio}px;width:${banner ? 56 : 68}px"></div>
  <div class="sub" style="left:${L.x}px;top:${L.sub[0]}px;font-size:${L.sub[1]}px">${L.subTxt}</div>`;
document.getElementById("palco").style.cssText = `width:${W}px;height:${H}px`;
const f = escuro ? "20,20,20" : "246,241,231";
document.getElementById("veu").style.background =
  `linear-gradient(90deg, rgba(${f},.92) 0%, rgba(${f},.80) 30%, rgba(${f},0) 46%)`;
await document.fonts.ready;
document.title = "pronto";
</script>
